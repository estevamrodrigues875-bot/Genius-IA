
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#100B1C">

    <title>Genius IA</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <main class="app">

        <header class="topbar">

            <div class="logo">G</div>

            <div class="brand">
                <h1>GENIUS IA</h1>
                <span>Criada por Estevam</span>
            </div>

            <button
                id="newChat"
                class="header-button"
                title="Nova conversa">
                +
            </button>

        </header>

        <section id="chat" class="chat">

            <div id="welcome" class="welcome">

                <div class="welcome-logo">G</div>

                <h2>Olá! Eu sou a Genius IA.</h2>

                <p>
                    Como posso ajudar você hoje?
                </p>

            </div>

            <div id="messages" class="messages"></div>

        </section>

        <footer class="bottom">

            <form id="chatForm" class="input-area">

                <textarea
                    id="messageInput"
                    placeholder="Pergunte alguma coisa..."
                    rows="1"
                    maxlength="10000"
                    required>
                </textarea>

                <button
                    id="sendButton"
                    type="submit"
                    title="Enviar">
                    ➤
                </button>

            </form>

            <div class="footer-info">
                Genius IA pode cometer erros.
            </div>

        </footer>

    </main>

    <script src="/script.js"></script>

</body>
</html>

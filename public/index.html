
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#100D1C">

    <title>Genius IA</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <div class="app-container">

        <!-- CABEÇALHO -->
        <header class="topbar">

            <div class="brand">
                <div class="brand-icon">G</div>

                <div class="brand-info">
                    <h1>Genius IA</h1>
                    <span>Inteligência Artificial</span>
                </div>
            </div>

            <button id="newChatBtn" class="icon-button" title="Nova conversa">
                +
            </button>

        </header>

        <!-- ÁREA PRINCIPAL -->
        <main class="chat-container">

            <section id="welcomeScreen" class="welcome-screen">

                <div class="welcome-logo">G</div>

                <h2>Olá! Eu sou a Genius IA.</h2>

                <p>
                    Como posso ajudar você hoje?
                </p>

            </section>

            <!-- MENSAGENS -->
            <section
                id="chatMessages"
                class="chat-messages"
                aria-live="polite"
            ></section>

            <!-- INDICADOR DE CARREGAMENTO -->
            <div id="loadingIndicator" class="loading-indicator" hidden>
                <span></span>
                <span></span>
                <span></span>
            </div>

        </main>

        <!-- ÁREA DE ENVIO -->
        <footer class="input-area">

            <form id="chatForm" class="input-box">

                <input
                    type="file"
                    id="fileInput"
                    hidden
                    multiple
                >

                <button
                    type="button"
                    id="attachBtn"
                    class="input-button"
                    title="Anexar arquivo"
                >
                    +
                </button>

                <textarea
                    id="messageInput"
                    placeholder="Pergunte alguma coisa..."
                    rows="1"
                    maxlength="12000"
                    aria-label="Digite sua mensagem"
                ></textarea>

                <button
                    type="submit"
                    id="sendBtn"
                    class="send-button"
                    title="Enviar mensagem"
                >
                    ↑
                </button>

            </form>

            <div class="footer-text">
                Genius IA pode cometer erros. Confira informações importantes.
            </div>

        </footer>

    </div>

    <script src="/script.js" defer></script>

</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#100D1C">

    <title>Genius IA</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="app-container">

    <!-- MENU LATERAL -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <h2>Genius <span>IA</span></h2>
        </div>

        <button id="newChatBtn" class="new-chat-btn">
            + Nova conversa
        </button>

        <div class="sidebar-section">
            <h3>Histórico</h3>

            <div id="historyList" class="history-list">
                <!-- Conversas adicionadas pelo script.js -->
            </div>
        </div>

        <div class="sidebar-footer">
            <p>Genius IA</p>
            <small>Criada por Estevam</small>
        </div>

    </aside>


    <!-- ÁREA PRINCIPAL -->

    <main class="main-content">

        <header class="topbar">

            <button id="menuBtn" class="menu-btn">
                ☰
            </button>

            <h3>Genius IA</h3>

            <button id="homeBtn" class="home-btn">
                Início
            </button>

        </header>


        <!-- TELA INICIAL -->

        <section id="welcomeScreen" class="welcome-screen">

            <div class="welcome-content">

                <div class="genius-logo">
                    G
                </div>

                <h1>Olá, seja bem-vindo!</h1>

                <h2>Eu sou a Genius IA.</h2>

                <p>
                    Sua inteligência artificial para criar,
                    aprender, pesquisar e conversar.
                </p>

                <button id="startChatBtn">
                    Começar conversa
                </button>

                <small>Uma criação de Estevam.</small>

            </div>

        </section>


        <!-- ÁREA DO CHAT -->

        <section id="chatScreen" class="chat-screen hidden">

            <div id="chatMessages" class="chat-messages">

                <!-- Mensagens aparecem aqui -->

            </div>

            <div class="chat-input-area">

                <div class="attachment-preview"
                     id="attachmentPreview">
                </div>

                <div class="input-container">

                    <input
                        type="file"
                        id="fileInput"
                        hidden
                        multiple
                    >

                    <button
                        id="attachBtn"
                        type="button"
                        title="Anexar arquivo"
                    >
                        +
                    </button>

                    <textarea
                        id="messageInput"
                        placeholder="Converse com a Genius..."
                        rows="1"
                    ></textarea>

                    <button
                        id="sendBtn"
                        type="button"
                    >
                        Enviar
                    </button>

                </div>

                <p class="input-disclaimer">
                    A Genius IA pode cometer erros. Confira informações importantes.
                </p>

            </div>

        </section>

    </main>

</div>

<script src="/script.js"></script>

</body>
</html>
